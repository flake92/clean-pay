name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Scan changed commits for secrets and PII-like credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze application source
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://clean_pay:clean_pay@localhost:5432/clean_pay?schema=public
      APP_URL: https://app.example.com
      NEXT_PUBLIC_APP_URL: https://app.example.com
      REMNASHOP_API_BASE_URL: https://shop.example.com/api/v1/public
      REMNASHOP_ADMIN_API_BASE_URL: https://shop.example.com/api/v1/admin
      REMNASHOP_API_KEY: ci-remnashop-admin-token
      REMNAWAVE_API_BASE_URL: https://wave.example.com/api
      REMNAWAVE_TOKEN: ci-remnawave-api-token
      REDIS_URL: redis://localhost:6379/0
      WEB_JWT_SECRET: ci-web-session-jwt-secret-must-be-long-and-distinct
      WEB_REFRESH_SECRET: ci-web-session-refresh-secret-must-be-long-distinct
      AUDIT_IP_HASH_SECRET: ci-audit-log-secret-must-be-long-and-distinct-value
      RATE_LIMIT_IDENTITY_SECRET: ci-rate-limit-secret-must-be-long-and-distinct
      READINESS_INTERNAL_SECRET: ci-readiness-secret-must-be-long-and-distinct
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      TELEGRAM_BOT_TOKEN: 100000001:ci-telegram-bot-token
      TELEGRAM_OIDC_CLIENT_ID: "100000001"
      TELEGRAM_OIDC_CLIENT_SECRET: ci-telegram-oidc-client-secret
      TELEGRAM_OIDC_ISSUER: https://oauth.telegram.org
      SUPPORT_ENABLED: "false"
      TURNSTILE_ENABLED: "false"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level high
      - name: Validate Prisma schema formatting
        run: node node_modules/prisma/build/index.js format --check
      - name: Validate deployment scripts and production Compose
        run: |
          sh -n deploy.sh start.sh scripts/*.sh deploy/prod/*.sh
          cp deploy/prod/.env.example deploy/prod/.env
          trap 'rm -f deploy/prod/.env' EXIT
          docker compose --env-file deploy/prod/.env -f deploy/prod/docker-compose.yml config --quiet
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce clean architecture boundaries
        run: npm run test:architecture
      - name: Test route-handler contracts
        run: npm run test:route-handlers
      - name: Test with enforced coverage thresholds
        run: npm run test:coverage
      - name: Test critical frontend components with enforced coverage thresholds
        run: npm run test:coverage:frontend
      - name: Build production application
        run: npm run build

  integration-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clean_pay
          POSTGRES_USER: clean_pay
          POSTGRES_PASSWORD: clean_pay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clean_pay -d clean_pay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://clean_pay:clean_pay_ci_password@localhost:5432/clean_pay?schema=public
      REAL_DATABASE_URL: postgresql://clean_pay:clean_pay_ci_password@localhost:5432/clean_pay?schema=public
      APP_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:8080
      REMNASHOP_API_BASE_URL: http://localhost:5000/api/v1/public
      REMNASHOP_ADMIN_API_BASE_URL: http://localhost:5000/api/v1/admin
      REMNASHOP_API_KEY: ci-remnashop-admin-token
      REDIS_URL: redis://localhost:6379/0
      WEB_JWT_SECRET: ci-web-session-jwt-secret-must-be-long-and-distinct
      WEB_REFRESH_SECRET: ci-web-session-refresh-secret-must-be-long-distinct
      AUDIT_IP_HASH_SECRET: ci-audit-log-secret-must-be-long-and-distinct-value
      RATE_LIMIT_IDENTITY_SECRET: ci-rate-limit-secret-must-be-long-and-distinct
      READINESS_INTERNAL_SECRET: ci-readiness-secret-must-be-long-and-distinct
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      TELEGRAM_OIDC_CLIENT_ID: "100000001"
      TELEGRAM_OIDC_CLIENT_SECRET: ci-telegram-oidc-client-secret
      TELEGRAM_BOT_TOKEN: 100000001:ci-telegram-bot-token
      TURNSTILE_ENABLED: "false"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations to an empty PostgreSQL database
        run: node node_modules/prisma/build/index.js migrate deploy
      - name: Run PostgreSQL concurrency and service integration tests
        run: npm run test:services

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the exact production runtime image
        run: >-
          docker build
          --target runner
          --build-arg NEXT_PUBLIC_APP_URL=https://app.example.com
          --build-arg TURNSTILE_ENABLED=true
          --build-arg TURNSTILE_WIDGET_ID=0x4AAAAACIBuildSiteKeyOnlyNotASecret
          --tag clean-pay:ci
          .
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: clean-pay:ci
          artifact-name: clean-pay-image.spdx.json
          format: spdx-json
      - name: Scan image packages and application dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clean-pay:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=30s 12m npm run test:e2e
        env:
          KEEP_E2E_STACK: "1"
          CLEAN_PAY_E2E_DIAGNOSTICS: "1"
      - name: Collect Docker diagnostics
        if: failure()
        run: docker compose -p clean-pay-dev -f .devcontainer/docker-compose.yml logs --tail=200
      - name: Clean up E2E stack
        if: always()
        run: docker compose -p clean-pay-dev -f .devcontainer/docker-compose.yml down --remove-orphans --volumes
