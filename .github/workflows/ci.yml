name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan changed commits for secrets and PII-like credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze application source
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SHELLCHECK_IMAGE: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
      HADOLINT_IMAGE: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Lint tracked shell scripts
        shell: bash
        run: |
          mapfile -d '' -t shell_files < <(git ls-files -z -- '*.sh')
          test "${#shell_files[@]}" -gt 0
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$PWD:/repo:ro" --workdir /repo \
            --entrypoint shellcheck \
            "$SHELLCHECK_IMAGE" "${shell_files[@]}"
      - name: Lint container build definitions
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$PWD:/repo:ro" --workdir /repo \
            --entrypoint /bin/hadolint \
            "$HADOLINT_IMAGE" Dockerfile .devcontainer/Dockerfile
      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --volume "$PWD:/repo:ro" --workdir /repo \
            "$ACTIONLINT_IMAGE" -no-color

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://clean_pay:clean_pay@localhost:5432/clean_pay?schema=public
      APP_URL: https://app.example.com
      NEXT_PUBLIC_APP_URL: https://app.example.com
      REMNASHOP_API_BASE_URL: https://shop.example.com/api/v1/public
      REMNASHOP_ADMIN_API_BASE_URL: https://shop.example.com/api/v1/admin
      REMNASHOP_API_KEY: ci-remnashop-admin-token
      REMNAWAVE_API_BASE_URL: https://wave.example.com/api
      REMNAWAVE_TOKEN: ci-remnawave-api-token
      REDIS_URL: redis://localhost:6379/0
      WEB_JWT_SECRET: ci-web-session-jwt-secret-must-be-long-and-distinct
      WEB_REFRESH_SECRET: ci-web-session-refresh-secret-must-be-long-distinct
      AUDIT_IP_HASH_SECRET: ci-audit-log-secret-must-be-long-and-distinct-value
      RATE_LIMIT_IDENTITY_SECRET: ci-rate-limit-secret-must-be-long-and-distinct
      READINESS_INTERNAL_SECRET: ci-readiness-secret-must-be-long-and-distinct
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      TELEGRAM_BOT_TOKEN: 100000001:ci-telegram-bot-token
      TELEGRAM_OIDC_CLIENT_ID: "100000001"
      TELEGRAM_OIDC_CLIENT_SECRET: ci-telegram-oidc-client-secret
      TELEGRAM_OIDC_ISSUER: https://oauth.telegram.org
      SUPPORT_ENABLED: "false"
      TURNSTILE_ENABLED: "false"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level high
      - name: Validate Prisma schema formatting
        run: node node_modules/prisma/build/index.js format --check
      - name: Validate deployment scripts and production Compose
        run: |
          sh -n deploy.sh start.sh scripts/*.sh deploy/prod/*.sh
          node tests/fixtures/write-synthetic-production-env.mjs deploy/prod/.env
          node deploy/prod/role-env.mjs materialize deploy/prod/.env
          trap 'rm -f deploy/prod/.env deploy/prod/.env.app deploy/prod/.env.hold-operator deploy/prod/.env.migration deploy/prod/.env.postgres deploy/prod/.env.provision deploy/prod/.env.reconciliation deploy/prod/.env.retention' EXIT
          docker compose --env-file deploy/prod/.env -f deploy/prod/docker-compose.yml config --quiet
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Enforce clean architecture boundaries
        run: npm run test:architecture
      - name: Test route-handler contracts
        run: npm run test:route-handlers
      - name: Test with enforced coverage thresholds
        run: npm run test:coverage
      - name: Test critical frontend components with enforced coverage thresholds
        run: npm run test:coverage:frontend
      - name: Build production application
        run: npm run build

  integration-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: clean_pay
          POSTGRES_USER: clean_pay
          POSTGRES_PASSWORD: clean_pay_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clean_pay -d clean_pay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://clean_pay:clean_pay_ci_password@localhost:5432/clean_pay?schema=public
      REAL_DATABASE_URL: postgresql://clean_pay:clean_pay_ci_password@localhost:5432/clean_pay?schema=public
      APP_URL: http://localhost:8080
      NEXT_PUBLIC_APP_URL: http://localhost:8080
      REMNASHOP_API_BASE_URL: http://localhost:5000/api/v1/public
      REMNASHOP_ADMIN_API_BASE_URL: http://localhost:5000/api/v1/admin
      REMNASHOP_API_KEY: ci-remnashop-admin-token
      REDIS_URL: redis://localhost:6379/0
      WEB_JWT_SECRET: ci-web-session-jwt-secret-must-be-long-and-distinct
      WEB_REFRESH_SECRET: ci-web-session-refresh-secret-must-be-long-distinct
      AUDIT_IP_HASH_SECRET: ci-audit-log-secret-must-be-long-and-distinct-value
      RATE_LIMIT_IDENTITY_SECRET: ci-rate-limit-secret-must-be-long-and-distinct
      READINESS_INTERNAL_SECRET: ci-readiness-secret-must-be-long-and-distinct
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      TELEGRAM_OIDC_CLIENT_ID: "100000001"
      TELEGRAM_OIDC_CLIENT_SECRET: ci-telegram-oidc-client-secret
      TELEGRAM_BOT_TOKEN: 100000001:ci-telegram-bot-token
      TURNSTILE_ENABLED: "false"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply migrations to an empty PostgreSQL database
        run: node node_modules/prisma/build/index.js migrate deploy
      - name: Run PostgreSQL concurrency and service integration tests
        run: npm run test:services

  database-least-privilege:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: clean_pay
          POSTGRES_USER: clean_pay_bootstrap
          POSTGRES_PASSWORD: ci-bootstrap-database-password-8Nm3Kp7Vr2Xs
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=libc --lc-collate=C --lc-ctype=C.UTF-8
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U clean_pay_bootstrap -d clean_pay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: production
      POSTGRES_DB: clean_pay
      POSTGRES_USER: clean_pay_bootstrap
      POSTGRES_PASSWORD: ci-bootstrap-database-password-8Nm3Kp7Vr2Xs
      DATABASE_URL: postgresql://clean_pay_app:ci-application-database-password-2Qx8Lm4Vr9Kp@127.0.0.1:55432/clean_pay?schema=public
      MIGRATION_DATABASE_URL: postgresql://clean_pay_migration:ci-migration-database-password-4Kp9Xs2Vr7Lm@127.0.0.1:55432/clean_pay?schema=public
      RETENTION_DATABASE_URL: postgresql://clean_pay_retention:ci-retention-database-password-7Xs3Kp8Vr2Lm@127.0.0.1:55432/clean_pay?schema=public
      HOLD_OPERATOR_DATABASE_URL: postgresql://clean_pay_hold:ci-hold-database-password-5Vr8Kp2Xm7Nc@127.0.0.1:55432/clean_pay?schema=public
      CLEAN_PAY_DATABASE_MAINTENANCE_CONFIRMED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Reproduce every reviewed PostgreSQL 17.11 public/custom catalog boundary
        env:
          DATABASE_CATALOG_ADMIN_URL: postgresql://clean_pay_bootstrap:ci-bootstrap-database-password-8Nm3Kp7Vr2Xs@127.0.0.1:55432/postgres
        run: node scripts/security/verify-database-catalog-states.mjs
      - name: Provision, migrate, synchronize, and verify exact database roles
        run: |
          node deploy/prod/database-role-provision.mjs prepare
          CLEAN_PAY_RUNTIME_ROLE=migration \
            DATABASE_URL="$MIGRATION_DATABASE_URL" \
            env -u POSTGRES_DB -u POSTGRES_USER -u POSTGRES_PASSWORD \
              -u MIGRATION_DATABASE_URL -u RETENTION_DATABASE_URL \
              -u HOLD_OPERATOR_DATABASE_URL \
              node node_modules/prisma/build/index.js migrate deploy
          node deploy/prod/database-role-provision.mjs sync
          node deploy/prod/database-role-provision.mjs verify
          node scripts/security/verify-database-runtime-privileges.mjs

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_DB: clean_pay
      POSTGRES_USER: clean_pay_bootstrap
      POSTGRES_PASSWORD: ci-postgres-password-not-real-and-distinct
      DATABASE_URL: postgresql://clean_pay_app:ci-application-database-password-not-real@postgres:5432/clean_pay?schema=public
      MIGRATION_DATABASE_URL: postgresql://clean_pay_migration:ci-migration-database-password-not-real@postgres:5432/clean_pay?schema=public
      RETENTION_DATABASE_URL: postgresql://clean_pay_retention:ci-retention-database-password-not-real@postgres:5432/clean_pay?schema=public
      HOLD_OPERATOR_DATABASE_URL: postgresql://clean_pay_hold:ci-hold-database-password-not-real@postgres:5432/clean_pay?schema=public
      REDIS_URL: redis://redis:6379/0
      APP_URL: https://pay.clean-pay.dev
      NEXT_PUBLIC_APP_URL: https://pay.clean-pay.dev
      REMNASHOP_API_BASE_URL: http://remnashop:5000/api/v1/public
      REMNASHOP_ADMIN_API_BASE_URL: http://remnashop:5000/api/v1/admin
      REMNASHOP_API_KEY: ci-remnashop-key-not-real-and-distinct
      REMNASHOP_AUTH_SERVICE_KEY: ci-remnashop-auth-key-not-real-and-distinct
      REMNAWAVE_API_BASE_URL: https://panel.clean-pay.dev
      REMNAWAVE_TOKEN: ci-remnawave-token-not-real-and-distinct
      REMNAWAVE_SUBSCRIPTION_ORIGINS: https://subscription.clean-pay.dev
      WEB_JWT_SECRET: ci-web-session-jwt-secret-not-real-and-distinct
      WEB_REFRESH_SECRET: ci-web-refresh-secret-not-real-and-distinct
      AUDIT_IP_HASH_SECRET: ci-audit-hash-secret-not-real-and-distinct
      TRUSTED_PROXY_HOPS: "1"
      RATE_LIMIT_IDENTITY_SECRET: ci-rate-limit-secret-not-real-and-distinct
      AUTH_RATE_LIMIT_CAPACITY: "1000"
      AUTH_CONCURRENCY_LIMIT: "64"
      READINESS_INTERNAL_SECRET: ci-readiness-secret-not-real-and-distinct
      TELEGRAM_OIDC_CLIENT_ID: "7654321098"
      TELEGRAM_OIDC_CLIENT_SECRET: ci-telegram-oidc-secret-not-real-and-distinct
      TELEGRAM_BOT_TOKEN: 7654321098:ci-telegram-bot-token-not-real
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      PAYMENT_RECONCILIATION_ENABLED: "false"
      PAYMENT_REDIRECT_ORIGINS: https://yoomoney.ru,https://pay.platega.io
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SITE_KEY: ci-turnstile-site-key-not-real
      TURNSTILE_SECRET_KEY: ci-turnstile-secret-not-real-and-distinct
      NEXT_PUBLIC_BRAND_NAME: Clean Pay
      NEXT_PUBLIC_BRAND_LOGO_URL: /clean-pay-logo.png
      CLEAN_PAY_DEPLOY_SOURCE: build
      CLEAN_PAY_IMAGE: clean-pay:ci
      CLEAN_PAY_MIGRATION_IMAGE: clean-pay-migration:ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Verify hardened data-service runtime boundaries
        run: bash scripts/security/verify-data-service-sandbox.sh
      - name: Build both exact executable container targets
        run: |
          public_contract_version="$(node scripts/security/compute-public-build-contract.mjs --version)"
          public_contract_sha256="$(node scripts/security/compute-public-build-contract.mjs)"
          docker build \
            --target runner \
            --build-arg CLEAN_PAY_RELEASE=ci \
            --build-arg CLEAN_PAY_REVISION="$GITHUB_SHA" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_VERSION="$public_contract_version" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_SHA256="$public_contract_sha256" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg TURNSTILE_ENABLED="$TURNSTILE_ENABLED" \
            --build-arg TURNSTILE_WIDGET_ID="$TURNSTILE_SITE_KEY" \
            --build-arg NEXT_PUBLIC_BRAND_NAME="$NEXT_PUBLIC_BRAND_NAME" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_URL="$NEXT_PUBLIC_BRAND_LOGO_URL" \
            --tag clean-pay:ci \
            .
          docker build \
            --target migration \
            --build-arg CLEAN_PAY_RELEASE=ci \
            --build-arg CLEAN_PAY_REVISION="$GITHUB_SHA" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_VERSION="$public_contract_version" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_SHA256="$public_contract_sha256" \
            --tag clean-pay-migration:ci \
            .
      - name: Smoke-test migration image environment validation
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 1g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --env DATABASE_URL="$MIGRATION_DATABASE_URL" \
            --env CLEAN_PAY_RUNTIME_ROLE=migration \
            --env CLEAN_PAY_DEPLOY_SOURCE \
            --env CLEAN_PAY_IMAGE \
            --env CLEAN_PAY_MIGRATION_IMAGE \
            clean-pay-migration:ci \
            node deploy/prod/validate-env.mjs
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 1g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --entrypoint sh clean-pay-migration:ci -ceu \
            'if touch /app/clean-pay-write-probe 2>/dev/null; then exit 1; fi; touch /tmp/clean-pay-write-probe; rm /tmp/clean-pay-write-probe'
      - name: Smoke-test the standalone production runtime
        run: |
          docker run --detach --name clean-pay-ci-runtime \
            --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 1g --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1001,gid=1001 \
            --publish 127.0.0.1:4000:4000 \
            --env DATABASE_URL \
            --env CLEAN_PAY_RUNTIME_ROLE=application \
            --env REDIS_URL \
            --env APP_URL \
            --env NEXT_PUBLIC_APP_URL \
            --env REMNASHOP_API_BASE_URL \
            --env REMNASHOP_ADMIN_API_BASE_URL \
            --env REMNASHOP_API_KEY \
            --env REMNASHOP_AUTH_SERVICE_KEY \
            --env REMNAWAVE_API_BASE_URL \
            --env REMNAWAVE_TOKEN \
            --env REMNAWAVE_SUBSCRIPTION_ORIGINS \
            --env WEB_JWT_SECRET \
            --env WEB_REFRESH_SECRET \
            --env AUDIT_IP_HASH_SECRET \
            --env TRUSTED_PROXY_HOPS \
            --env RATE_LIMIT_IDENTITY_SECRET \
            --env AUTH_RATE_LIMIT_CAPACITY \
            --env AUTH_CONCURRENCY_LIMIT \
            --env READINESS_INTERNAL_SECRET \
            --env TELEGRAM_OIDC_CLIENT_ID \
            --env TELEGRAM_OIDC_CLIENT_SECRET \
            --env TELEGRAM_BOT_TOKEN \
            --env COOKIE_SECURE \
            --env COOKIE_SAMESITE \
            --env PAYMENT_RECONCILIATION_ENABLED \
            --env PAYMENT_REDIRECT_ORIGINS \
            --env TURNSTILE_ENABLED \
            --env TURNSTILE_SITE_KEY \
            --env TURNSTILE_SECRET_KEY \
            --env NEXT_PUBLIC_BRAND_NAME \
            --env NEXT_PUBLIC_BRAND_LOGO_URL \
            --env CLEAN_PAY_DEPLOY_SOURCE \
            --env CLEAN_PAY_IMAGE \
            --env CLEAN_PAY_MIGRATION_IMAGE \
            clean-pay:ci
          trap 'docker logs clean-pay-ci-runtime || true; docker rm --force clean-pay-ci-runtime >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:4000/api/health/liveness
          curl --fail --silent --show-error --output /dev/null \
            'http://127.0.0.1:4000/_next/image?url=%2Fclean-pay-logo.png&w=64&q=75'
          node scripts/security/verify-server-action-boundary.mjs \
            http://127.0.0.1:4000 "$NEXT_PUBLIC_APP_URL"
          docker exec clean-pay-ci-runtime sh -ceu \
            'if touch /app/clean-pay-write-probe 2>/dev/null; then exit 1; fi; touch /tmp/clean-pay-write-probe; rm /tmp/clean-pay-write-probe; touch /app/.next/cache/clean-pay-write-probe; rm /app/.next/cache/clean-pay-write-probe'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' clean-pay-ci-runtime)" = true
          if docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' clean-pay-ci-runtime \
            | grep -Eq '^(POSTGRES_(DB|USER|PASSWORD)|MIGRATION_DATABASE_URL|RETENTION_DATABASE_URL|HOLD_OPERATOR_DATABASE_URL)='; then
            echo 'application container contains bootstrap or peer database credentials' >&2
            exit 1
          fi
          docker inspect --format '{{json .HostConfig.CapDrop}}' clean-pay-ci-runtime | grep --quiet ALL
          docker inspect --format '{{json .HostConfig.SecurityOpt}}' clean-pay-ci-runtime | grep --quiet no-new-privileges
          docker logs clean-pay-ci-runtime 2>&1 | grep --quiet 'event=production_environment_validated'
          node scripts/security/verify-app-graceful-request.mjs \
            http://127.0.0.1:4000 "$NEXT_PUBLIC_APP_URL" clean-pay-ci-runtime 120
      - name: Verify the full hardened migration and worker topology
        run: bash scripts/security/verify-runtime-sandbox.sh clean-pay:ci clean-pay-migration:ci
      - name: Generate application image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: clean-pay:ci
          artifact-name: clean-pay-application-image.spdx.json
          format: spdx-json
      - name: Generate migration image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: clean-pay-migration:ci
          artifact-name: clean-pay-migration-image.spdx.json
          format: spdx-json
      - name: Inventory application image High and Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clean-pay:ci
          format: json
          output: clean-pay-application.trivy.json
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Inventory migration image High and Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clean-pay-migration:ci
          format: json
          output: clean-pay-migration.trivy.json
          exit-code: "0"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
      - name: Enforce exact owned and expiring vulnerability exceptions
        run: |
          node scripts/security/enforce-container-vulnerability-policy.mjs \
            --report clean-pay-application.trivy.json \
            --policy security/container-vulnerability-exceptions.json \
            --target runner \
            --mode inventory \
            --output clean-pay-application.vulnerability-attestation.json
          node scripts/security/enforce-container-vulnerability-policy.mjs \
            --report clean-pay-migration.trivy.json \
            --policy security/container-vulnerability-exceptions.json \
            --target migration \
            --mode inventory \
            --output clean-pay-migration.vulnerability-attestation.json
      - name: Preserve complete vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-vulnerability-evidence
          if-no-files-found: error
          retention-days: 30
          path: |
            clean-pay-application.trivy.json
            clean-pay-migration.trivy.json
            clean-pay-application.vulnerability-attestation.json
            clean-pay-migration.vulnerability-attestation.json

  production-image-browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLEAN_PAY_BROWSER_COMPOSE_PROJECT: clean-pay-browser-journey-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CLEAN_PAY_BROWSER_APP_IMAGE: clean-pay:journey-ci
      CLEAN_PAY_BROWSER_MIGRATION_IMAGE: clean-pay-migration:journey-ci
      CLEAN_PAY_BROWSER_SOURCE_REVISION: ${{ github.sha }}
      CLEAN_PAY_BROWSER_SOURCE_IMAGE_TAG: clean-pay:journey-ci
      CLEAN_PAY_BROWSER_MIGRATION_IMAGE_TAG: clean-pay-migration:journey-ci
      CLEAN_PAY_BROWSER_APP_PORT: "4100"
      CLEAN_PAY_BROWSER_PROVIDER_PORT: "13100"
      CLEAN_PAY_BROWSER_PROXY_BIND: 127.0.0.2
      NEXT_PUBLIC_APP_URL: https://pay.ci.clean-pay.dev
      NEXT_PUBLIC_BRAND_NAME: Clean Pay
      NEXT_PUBLIC_BRAND_LOGO_URL: /clean-pay-logo.png
      TURNSTILE_ENABLED: "true"
      TURNSTILE_SITE_KEY: 0x4AAAAABrowserJourneyOnly8Wp4Jz7Lc2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies and pinned Chromium
        run: |
          npm ci
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build synthetic production-image targets
        run: |
          public_contract_version="$(node scripts/security/compute-public-build-contract.mjs --version)"
          public_contract_sha256="$(node scripts/security/compute-public-build-contract.mjs)"
          test "$public_contract_version" = "1"
          docker build \
            --target runner \
            --build-arg CLEAN_PAY_RELEASE=journey-ci \
            --build-arg CLEAN_PAY_REVISION="$GITHUB_SHA" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_VERSION="$public_contract_version" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_SHA256="$public_contract_sha256" \
            --build-arg NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            --build-arg TURNSTILE_ENABLED="$TURNSTILE_ENABLED" \
            --build-arg TURNSTILE_WIDGET_ID="$TURNSTILE_SITE_KEY" \
            --build-arg NEXT_PUBLIC_BRAND_NAME="$NEXT_PUBLIC_BRAND_NAME" \
            --build-arg NEXT_PUBLIC_BRAND_LOGO_URL="$NEXT_PUBLIC_BRAND_LOGO_URL" \
            --tag "$CLEAN_PAY_BROWSER_APP_IMAGE" \
            .
          docker build \
            --target migration \
            --build-arg CLEAN_PAY_RELEASE=journey-ci \
            --build-arg CLEAN_PAY_REVISION="$GITHUB_SHA" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_VERSION="$public_contract_version" \
            --build-arg CLEAN_PAY_PUBLIC_BUILD_CONTRACT_SHA256="$public_contract_sha256" \
            --tag "$CLEAN_PAY_BROWSER_MIGRATION_IMAGE" \
            .
          image_digest="$(docker image inspect --format '{{.Id}}' "$CLEAN_PAY_BROWSER_APP_IMAGE")"
          migration_image_digest="$(docker image inspect --format '{{.Id}}' "$CLEAN_PAY_BROWSER_MIGRATION_IMAGE")"
          printf '%s\n' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$migration_image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          {
            printf 'CLEAN_PAY_BROWSER_SOURCE_IMAGE_DIGEST=%s\n' "$image_digest"
            printf 'CLEAN_PAY_BROWSER_MIGRATION_IMAGE_DIGEST=%s\n' "$migration_image_digest"
            printf 'CLEAN_PAY_BROWSER_PUBLIC_BUILD_CONTRACT_SHA256=%s\n' "$public_contract_sha256"
          } >> "$GITHUB_ENV"
      - name: Run read-only production-image journey gate
        env:
          CLEAN_PAY_BROWSER_JOURNEY_ENV_DIR: ${{ runner.temp }}/clean-pay-browser-journey-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run test:browser:journey:production-image
      - name: Preserve sanitized browser journey evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-image-browser-journey-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: test-results/browser-journeys
      - name: Clean up only the owned browser journey project
        if: always()
        env:
          CLEAN_PAY_BROWSER_JOURNEY_ENV_DIR: ${{ runner.temp }}/clean-pay-browser-journey-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/browser/journeys/run-production-image-journey.mjs cleanup

  remnashop-migration-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REMNASHOP_SOURCE: ${{ github.workspace }}/.migration-remnashop
      REHEARSAL_OUTPUT_DIR: ${{ github.workspace }}/.migration-rehearsal
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Rehearse populated Clean Pay session, payment and rollback migrations
        shell: bash
        run: bash scripts/security/rehearse-clean-pay-migrations.sh
      - name: Check out the exact reviewed Remnashop migration source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: flake92/remnashop
          ref: 837d964269078142307794ba3566a30d40b7b0b6
          path: .migration-remnashop
          fetch-depth: 1
          persist-credentials: false
      - name: Rehearse non-empty forward, no-op, restore, timeout and resume
        shell: bash
        run: bash scripts/security/rehearse-remnashop-migrations.sh
      - name: Preserve sanitized migration recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remnashop-migration-rehearsal
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: |
            .migration-rehearsal/report.json
            .migration-rehearsal/clean-pay-report.json
            .migration-rehearsal/*.log
            .migration-rehearsal/*.list

  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLEAN_PAY_DEVCONTAINER_PROJECT: clean-pay-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      REMNASHOP_HOST_SOURCE: ${{ github.workspace }}/.e2e-remnashop
      REMNASHOP_BUILD_REVISION: 837d964269078142307794ba3566a30d40b7b0b6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check out the exact Remnashop PR 135 commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: flake92/remnashop
          ref: 837d964269078142307794ba3566a30d40b7b0b6
          path: .e2e-remnashop
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=30s 12m npm run test:e2e
        env:
          KEEP_E2E_STACK: "1"
          CLEAN_PAY_E2E_DIAGNOSTICS: "1"
      - name: Collect Docker diagnostics
        if: failure()
        run: docker compose -p "$CLEAN_PAY_DEVCONTAINER_PROJECT" -f .devcontainer/docker-compose.yml logs --tail=200
      - name: Clean up E2E stack
        if: always()
        run: docker compose -p "$CLEAN_PAY_DEVCONTAINER_PROJECT" -f .devcontainer/docker-compose.yml down --remove-orphans --volumes
