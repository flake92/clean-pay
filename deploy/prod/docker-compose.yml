name: ${COMPOSE_PROJECT_NAME:-clean-pay-prod}

# Consumed by deploy.sh before Compose starts a build. Keeping the value in
# the rendered configuration makes the production example self-documenting.
x-clean-pay-min-free-disk-mb: ${CLEAN_PAY_MIN_FREE_DISK_MB:-8192}

x-clean-pay-runtime-sandbox: &clean-pay-runtime-sandbox
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db-role-provision:
    <<: *clean-pay-runtime-sandbox
    image: ${CLEAN_PAY_MIGRATION_IMAGE:-clean-pay-prod-migration:local}
    restart: "no"
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    command: ["node", "deploy/prod/database-role-provision.mjs", "prepare"]
    env_file:
      - ${CLEAN_PAY_PROVISION_ENV_FILE:-.env.provision}
    environment:
      CLEAN_PAY_DATABASE_MAINTENANCE_CONFIRMED: "true"
      CLEAN_PAY_RUNTIME_ROLE: provision
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:

  migration:
    <<: *clean-pay-runtime-sandbox
    image: ${CLEAN_PAY_MIGRATION_IMAGE:-clean-pay-prod-migration:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
      args:
        CLEAN_PAY_RELEASE: ${CLEAN_PAY_RELEASE:-local}
        CLEAN_PAY_REVISION: ${CLEAN_PAY_REVISION:-local}
    restart: "no"
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    env_file:
      - ${CLEAN_PAY_MIGRATION_ENV_FILE:-.env.migration}
    environment:
      CLEAN_PAY_RUNTIME_ROLE: migration
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db-role-provision:
        condition: service_completed_successfully
    networks:
      default:

  db-grant-sync:
    <<: *clean-pay-runtime-sandbox
    image: ${CLEAN_PAY_MIGRATION_IMAGE:-clean-pay-prod-migration:local}
    restart: "no"
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    command: ["node", "deploy/prod/database-role-provision.mjs", "sync"]
    env_file:
      - ${CLEAN_PAY_PROVISION_ENV_FILE:-.env.provision}
    environment:
      CLEAN_PAY_DATABASE_MAINTENANCE_CONFIRMED: "true"
      CLEAN_PAY_RUNTIME_ROLE: provision
      NODE_ENV: production
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      default:

  app:
    <<: *clean-pay-runtime-sandbox
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        CLEAN_PAY_RELEASE: ${CLEAN_PAY_RELEASE:-local}
        CLEAN_PAY_REVISION: ${CLEAN_PAY_REVISION:-local}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:?TURNSTILE_ENABLED=true is required}
        TURNSTILE_WIDGET_ID: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Clean Pay}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL:-/clean-pay-logo.png}
    restart: unless-stopped
    init: true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,mode=0700,uid=1001,gid=1001
    env_file:
      - ${CLEAN_PAY_APP_ENV_FILE:-.env.app}
    environment:
      CLEAN_PAY_RUNTIME_ROLE: application
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db-grant-sync:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CLEAN_PAY_BIND:-127.0.0.1}:${CLEAN_PAY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/internal/health/readiness',{headers:{'x-clean-pay-readiness-secret':process.env.READINESS_INTERNAL_SECRET},signal:AbortSignal.timeout(10000)}).then(async r=>{const b=await r.json();if(!b.checks||b.checks.database?.status!=='ok'||b.checks.redis?.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 12s
      retries: 20
      start_period: 30s
    networks:
      default:
      edge:
        aliases:
          - clean-pay
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reconciliation-worker:
    <<: *clean-pay-runtime-sandbox
    profiles: ["reconciliation"]
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    stop_grace_period: 2m
    restart: "on-failure"
    command: ["node", "deploy/prod/reconcile-loop.mjs"]
    env_file:
      - ${CLEAN_PAY_RECONCILIATION_ENV_FILE:-.env.reconciliation}
    environment:
      CLEAN_PAY_RUNTIME_ROLE: reconciliation
      NODE_ENV: production
      PAYMENT_RECONCILIATION_INTERNAL_URL: http://app:4000/api/internal/payments/reconcile
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const fs=require('node:fs');const value=Number(fs.readFileSync('/tmp/clean-pay-reconciliation-heartbeat','utf8'));const interval=Number(process.env.PAYMENT_RECONCILIATION_INTERVAL_SECONDS||30);const maxAge=(Math.max(120,interval*2+60))*1000;if(!Number.isFinite(value)||Date.now()-value>maxAge)process.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  retention-worker:
    <<: *clean-pay-runtime-sandbox
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    stop_grace_period: 2m
    restart: unless-stopped
    command: ["node", "deploy/prod/retention-loop.mjs"]
    env_file:
      - ${CLEAN_PAY_RETENTION_ENV_FILE:-.env.retention}
    environment:
      CLEAN_PAY_RUNTIME_ROLE: retention
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "deploy/prod/retention-heartbeat.mjs", "check"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      default:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  retention-hold:
    <<: *clean-pay-runtime-sandbox
    profiles: ["operations"]
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    restart: "no"
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    command: ["node", "deploy/prod/payment-retention-hold-command.mjs"]
    env_file:
      - ${CLEAN_PAY_HOLD_OPERATOR_ENV_FILE:-.env.hold-operator}
    environment:
      CLEAN_PAY_RUNTIME_ROLE: hold-operator
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: "70:70"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    env_file:
      - ${CLEAN_PAY_POSTGRES_ENV_FILE:-.env.postgres}
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=libc --lc-collate=C --lc-ctype=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3777,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    user: "999:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
    external: true
    name: ${CLEAN_PAY_EDGE_NETWORK:-remnawave-network}
