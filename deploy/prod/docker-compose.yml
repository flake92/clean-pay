name: ${COMPOSE_PROJECT_NAME:-clean-pay-prod}

# Consumed by deploy.sh before Compose starts a build. Keeping the value in
# the rendered configuration makes the production example self-documenting.
x-clean-pay-min-free-disk-mb: ${CLEAN_PAY_MIN_FREE_DISK_MB:-8192}

services:
  migration:
    image: ${CLEAN_PAY_MIGRATION_IMAGE:-clean-pay-prod-migration:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:

  app:
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:?TURNSTILE_ENABLED=true is required}
        TURNSTILE_WIDGET_ID: ${TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-Clean Pay}
        NEXT_PUBLIC_BRAND_LOGO_URL: ${NEXT_PUBLIC_BRAND_LOGO_URL:-/clean-pay-logo.png}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${CLEAN_PAY_BIND:-127.0.0.1}:${CLEAN_PAY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/internal/health/readiness',{headers:{'x-clean-pay-readiness-secret':process.env.READINESS_INTERNAL_SECRET},signal:AbortSignal.timeout(10000)}).then(async r=>{const b=await r.json();if(!b.checks||b.checks.database?.status!=='ok'||b.checks.redis?.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 12s
      retries: 20
      start_period: 30s
    networks:
      default:
      edge:
        aliases:
          - clean-pay
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reconciliation-worker:
    profiles: ["reconciliation"]
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    restart: "on-failure:5"
    command: ["node", "deploy/prod/reconcile-loop.mjs"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PAYMENT_RECONCILIATION_INTERNAL_URL: http://app:4000/api/internal/payments/reconcile
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const fs=require('node:fs');const value=Number(fs.readFileSync('/tmp/clean-pay-reconciliation-heartbeat','utf8'));const interval=Number(process.env.PAYMENT_RECONCILIATION_INTERVAL_SECONDS||30);const maxAge=(Math.max(120,interval*2+60))*1000;if(!Number.isFinite(value)||Date.now()-value>maxAge)process.exit(1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  retention-worker:
    image: ${CLEAN_PAY_IMAGE:-clean-pay-prod-app:local}
    restart: unless-stopped
    command: ["node", "deploy/prod/retention-loop.mjs"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const fs=require('node:fs');const value=Number(fs.readFileSync('/tmp/clean-pay-retention-heartbeat','utf8'));const interval=Number(process.env.DATA_RETENTION_INTERVAL_SECONDS||21600);const maxAge=(interval+600)*1000;if(!Number.isFinite(value)||Date.now()-value>maxAge)process.exit(1)"
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      default:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clean_pay}
      POSTGRES_USER: ${POSTGRES_USER:-clean_pay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
    external: true
    name: ${CLEAN_PAY_EDGE_NETWORK:-remnawave-network}
